[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgisense"
version = "0.1.0"
description = "Reproducible precision oncology research workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Shlok Bansal"}]
dependencies = [
  "duckdb>=1.2,<2",
  "lifelines>=0.30,<0.31",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<22",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
surgisense = "surgisense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surgisense = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
